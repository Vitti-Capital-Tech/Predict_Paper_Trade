<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" role="img" aria-label="Predict">
  <!--
    Full lockup: the mark plus the wordmark.
    The mark is the app's own chart in miniature — a dashed target threshold
    with the price crossing it, since that crossing is the entire question a
    Predict market asks.
  -->
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a2a"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="logo-line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f8fef"/>
      <stop offset="100%" stop-color="#5fb0ff"/>
    </linearGradient>
  </defs>

  <g>
    <rect width="64" height="64" rx="14" fill="url(#logo-bg)"/>

    <!-- target threshold -->
    <line x1="11" y1="38" x2="53" y2="38" stroke="#5d6b82" stroke-width="2.5"
          stroke-linecap="round" stroke-dasharray="1 5"/>

    <!-- TWAP, the line the venue settles on -->
    <path d="M12 46 Q28 43 38 37 T52 30" fill="none" stroke="#f0b90b"
          stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>

    <!-- price crossing the threshold -->
    <path d="M12 48 L21 44 L28 46 L36 27 L44 31 L52 16" fill="none"
          stroke="url(#logo-line)" stroke-width="5" stroke-linecap="round"
          stroke-linejoin="round"/>

    <circle cx="52" cy="16" r="4.5" fill="#5fb0ff"/>
  </g>

  <text x="78" y="41" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="26" font-weight="600" font-style="italic" fill="#2f8fef"
        letter-spacing="-0.5">Predict</text>
</svg>
