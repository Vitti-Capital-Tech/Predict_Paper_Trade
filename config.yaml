# Delta Exchange "Predict" paper-trading configuration.
#
# Rules marked AMBIGUOUS below are readings of the original strategy note that
# could reasonably go the other way. They are flags, not assumptions baked into
# code - flip them and re-run rather than arguing about the definition.

run_name: default
data_dir: data

api:
  base_url: https://api.delta.exchange   # global.delta.exchange; binaries are NOT on the India host
  underlying: BTC                        # BTC or ETH
  poll_interval_sec: 2.0
  request_timeout_sec: 10.0
  max_retries: 3

# "Do it only when BTC ATR is more than 200"
atr:
  candle_symbol: BTCUSDT   # do NOT use BTCUSD here - that series is stale/flat
  resolution: 5m
  period: 14
  min_atr: 200.0
  refresh_sec: 30.0
  enabled: true

# "Give a filter for timings"
# Two axes: position inside the round, and wall-clock session.
timing:
  # Delta halts trading for the final minute of a round - positions can be
  # neither opened nor closed. Enforced as a hard floor on entries and exits.
  trading_halt_sec: 60.0
  min_seconds_since_launch: 30.0    # let the book settle after a round lists
  max_seconds_since_launch: 900.0
  min_seconds_to_expiry: 180.0      # no entries in the last 3 minutes
  max_seconds_to_expiry: 1800.0
  sessions: []                      # e.g. ["13:00-21:00"] - empty = all hours
  session_timezone: IST             # UTC or IST
  weekdays: [0, 1, 2, 3, 4, 5, 6]   # 0 = Monday

# "entry in 1st and last strike, atleast 1:5 odds on both"
# "Middle strike entry only if entry has 1:3 odds"
entry:
  # AMBIGUOUS - what "1:5" means as a price ceiling:
  #   risk_reward     -> risk 1 to win 5 -> max price 1/(1+5) = 0.1667   [default]
  #   payout_multiple -> 5x gross payout -> max price 1/5     = 0.2000
  odds_convention: risk_reward
  wing_odds: 5.0
  middle_odds: 3.0

  trade_wings: true
  require_both_wings: true   # skip the round unless BOTH wings qualify
  trade_middle: false        # turn on to add the middle-strike leg
  middle_side: auto          # auto | call | put

  size_contracts: 100        # see README - size is the dominant slippage driver
  one_entry_per_round: true

# "exit rule ITM 50"
exit:
  # AMBIGUOUS - what "ITM 50" means:
  #   price       -> close when the contract is worth 0.50          [default]
  #   spot_points -> close when spot is 50 points past the strike
  mode: price
  take_profit_price: 0.50
  spot_points_itm: 50.0
  stop_loss_price: null            # e.g. 0.02 to cut a dead wing early
  close_loser_on_tp: false
  flatten_before_expiry_sec: null  # e.g. 30 to never carry into settlement

# "Need to be careful about the slippages"
fills:
  model: orderbook          # orderbook (realistic) | best_quote | mark (optimistic)
  extra_slippage_ticks: 0.0 # adverse padding beyond visible depth
  tick_size: 0.0001
  max_book_levels: 20
  allow_partial: false      # false = reject rather than silently under-fill
  refetch_book_on_execute: true
  max_spread_frac: 1.5      # skip a leg whose spread exceeds 150% of mid

portfolio:
  starting_cash: 10000.0
  max_concurrent_rounds: 2
  max_cost_per_round: null
  taker_fee_rate: 0.0       # venue currently reports 0 commission on binaries
  maker_fee_rate: 0.0
